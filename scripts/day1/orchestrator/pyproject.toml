# scripts/day1/orchestrator/pyproject.toml — the `atlas` package (CONVENTIONS.md §1 orchestrator/, §7.8, §7.9).
# Installed in editable mode into $ATLAS_OPT/venv by phase2/02-orchestrator.sh (its header states the contract:
# console scripts atlas-orchestrator and atlas-admin, celery[redis]==5.6.3, module atlas.celery_app exposing `app`).
#
# Pins (rule §7.9: pinned where the research gives a pin, unpinned otherwise):
#   celery[redis]==5.6.3   services-tools.md §11 (VERIFIED PyPI 2026-03-26)
#   redis==6.4.0           CONFLICT, resolved here: services-tools.md and phase2/02-orchestrator.sh name redis==8.1.0, but
#                          celery[redis]==5.6.3 -> kombu[redis] 5.6.x, whose redis extra is "redis!=4.5.5,!=5.0.2,<6.5,>=4.5.2"
#                          (VERIFIED PyPI metadata, kombu 5.6.2), so `pip install "celery[redis]==5.6.3" "redis==8.1.0"` is
#                          ResolutionImpossible (reproduced with pip 25 on Python 3.12, 2026-09-26). 6.4.0 is the newest
#                          client inside kombu's tested range. Only kombu 5.7.0a1 (pre-release) lifts the cap to <9.0.
#   chromadb-client==1.5.9 services-tools.md (VERIFIED; the thin client matching the pinned server image)
#   fastapi, uvicorn, httpx, pydantic, pyyaml, python-frontmatter: no research pin exists; lower bounds only (the README
#                          must say so, rule §7.9). Resolved 2026-09-26 on Python 3.12: fastapi 0.141.1, uvicorn 0.54.0,
#                          httpx 0.28.1, pydantic 2.13.5, PyYAML 6.0.3, python-frontmatter 1.3.0.
# SQLite comes from the standard library (sqlite3); no dependency.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "A.T.L.A.S. orchestrator: Engine Arbiter, 4-Way Router, approval gate, task ledger (Day 1 Phase 2 step 2)"
readme = { text = "See scripts/day1/CONVENTIONS.md and docs/ATLAS_FRAMEWORK_REVIEW.md.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "chromadb-client==1.5.9",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# atlas-admin and atlas-api are the names in the writer brief; atlas-orchestrator is the name phase2/02-orchestrator.sh
# and systemd/atlas-orchestrator.service run (same entry point). atlas.api is another writer's module (the FastAPI app);
# console scripts resolve lazily, so this package installs before it exists.
atlas-admin = "atlas.admin:main"
atlas-api = "atlas.api:main"
atlas-orchestrator = "atlas.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
