# scripts/day1/orchestrator/pyproject.toml — the `atlas` package (CONVENTIONS.md §1 orchestrator/, §7.8, §7.9).
# Installed in editable mode into $ATLAS_OPT/venv by phase2/02-orchestrator.sh (its header states the contract:
# console scripts atlas-orchestrator and atlas-admin, celery[redis]==5.6.3, module atlas.celery_app exposing `app`).
#
# Pins (rule §7.9: pinned where the research gives a pin, unpinned otherwise). This header is the package's record of
# the resolved pins (there is no orchestrator/README.md; scripts/day1/README.md is the other writers' file):
#   celery[redis]==5.6.3   services-tools.md §11 (VERIFIED PyPI 2026-03-26)
#   redis==6.4.0           RESOLVED PIN, agreed with phase2/02-orchestrator.sh (its header and its die message name the
#                          same pair). The research named redis==8.1.0, but celery[redis]==5.6.3 -> kombu[redis] 5.6.x,
#                          whose redis extra is "redis!=4.5.5,!=5.0.2,<6.5,>=4.5.2" (VERIFIED PyPI metadata, kombu
#                          5.6.2), so `pip install "celery[redis]==5.6.3" "redis==8.1.0"` is ResolutionImpossible
#                          (reproduced with pip 25 on Python 3.12, 2026-09-26). 6.4.0 is the newest client inside
#                          kombu's tested range. Only kombu 5.7.0a1 (pre-release) lifts the cap to <9.0.
#   chromadb-client==1.5.9 services-tools.md (VERIFIED; the thin client matching the pinned server image)
#   pytest==9.1.1          a RUNTIME dependency on purpose (resolved pin, see below): V14a/V15/V16 run `pytest` in
#                          $ATLAS_OPT/venv at the Phase 2 gate, and 02-orchestrator.sh installs `-e $ORCH_DIR` without
#                          the [dev] extra and then makes the venv read-only for atlas, so phase2/10-gate.sh's
#                          `_gate_ensure_pytest` fallback (an unpinned pip download during the gate) is NOT the expected
#                          route; ruff stays in the dev extra (never needed on the node).
#   fastapi, uvicorn, httpx, pydantic, pyyaml, python-frontmatter, pytest: no research pin exists, so these are
#                          RESOLVED PINS (fix round, rule §7.9): the versions pip resolved on 2026-09-26 on Python 3.12
#                          and re-resolved identically on CPython 3.14.7, which the unit tests were run against
#                          (fastapi 0.141.1, uvicorn 0.54.0, httpx 0.28.1, pydantic 2.13.5, PyYAML 6.0.3,
#                          python-frontmatter 1.3.0, pytest 9.1.1). A Day 1 install on the node therefore gets the
#                          tested set, not whatever is newest that day. Bumping one is a deliberate edit here.
#   setuptools==80.9.0     RESOLVED PIN (fix round 3): the build backend of the isolated editable build. A lower bound
#                          here made every `uv pip install -e` on the node download whatever setuptools was newest on
#                          pypi.org that day, which the header's "a Day 1 install gets the tested set" did not cover.
#                          80.9.0 is the version the isolated build resolved on 2026-09-26 (PyPI release 2025-05-27;
#                          >= 77 for the PEP 639 string `license`), re-verified with `uv pip install -e .` on
#                          CPython 3.12 on 2026-10-04.
#   ruff==0.15.8           RESOLVED PIN (fix round 3, dev extra only, never on the node): the version `ruff check src
#                          tests` was run with; an unpinned ruff drifted between writer and reviewer (new E501 rules).
# SQLite comes from the standard library (sqlite3); no dependency.
# `license` uses the PEP 639 string form: setuptools >= 77 warns on the TOML-table form and rejects it from 2027-02.

[build-system]
requires = ["setuptools==80.9.0"]  # exact: the isolated build must not take whatever is newest that day (rule §7.9)
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "A.T.L.A.S. orchestrator: Engine Arbiter, 4-Way Router, approval gate, task ledger (Day 1 Phase 2 step 2)"
readme = { text = "See scripts/day1/CONVENTIONS.md and docs/ATLAS_FRAMEWORK_REVIEW.md.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "chromadb-client==1.5.9",
  "pyyaml==6.0.3",
  "python-frontmatter==1.3.0",
  "pytest==9.1.1",
]

[project.optional-dependencies]
dev = ["ruff==0.15.8"]  # rule §7.9: the version the suite was checked with (header)

[project.scripts]
# atlas-admin and atlas-api are the names in the writer brief; atlas-orchestrator is the name phase2/02-orchestrator.sh
# and systemd/atlas-orchestrator.service run (same entry point). atlas.api is another writer's module (the FastAPI app);
# console scripts resolve lazily, so this package installs before it exists.
atlas-admin = "atlas.admin:main"
atlas-api = "atlas.api:main"
atlas-orchestrator = "atlas.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
