# docker/core/compose.yml — the Docker core (CONVENTIONS.md §1): redis, chromadb and open-webui here; kokoro, speaches
# (Whisper) and docling-serve in docker/core/compose.voice.yml (the voice writer's overlay, merged into THIS project by
# phase2/05-voice.sh with `-f compose.yml -f compose.voice.yml`; it joins the `atlas` network defined below and takes
# SPEACHES_PRELOAD_MODELS / SPEACHES_HF_HUB_OFFLINE from /etc/atlas/voice.env). ntfy is NOT here: Phase 1 step 7
# brought it up from docker/ntfy/compose.yml as project "atlas-ntfy" on port 8090 (contract note in that file).
# WG-Easy likewise lives in docker/wg-easy/compose.yml.
# LAYOUT NOTE (fix round): CONVENTIONS.md §1 line 31 lists all six services in this one file. Folding the voice
# overlay in would mean rewriting compose.voice.yml and phase2/05-voice.sh (other writers' files), so the split stays
# and CONVENTIONS.md §1 needs the Principal's amendment to name compose.voice.yml and docker/ntfy/compose.yml.
# §8 AMENDMENT NEEDED (fix round 2): CONVENTIONS.md §8 lists ChromaDB 8000 and the orchestrator $ORCH_PORT under "binds
# to loopback, LAN and WireGuard addresses only"; both are LOOPBACK ONLY here and in phase2/02-orchestrator.sh
# (ORCH_HOST=127.0.0.1): the 1.x Rust ChromaDB server has no auth, and Open WebUI's Filter reaches the orchestrator on
# lo. §8 should read "ChromaDB 8000 (loopback only)" and "orchestrator $ORCH_PORT (loopback only)", and
# phase2/04-memory.sh's header "bound to loopback/LAN/WG" should read 127.0.0.1:8000 (other writers' files).
#
# Project name is fixed below (`name:`) so that every caller shares one project whatever its working directory:
#   docker compose -f <this file> --env-file /etc/atlas/core.env up -d <service>
# /etc/atlas/core.env is written by phase2/02-orchestrator.sh (_core_env_write) as a superset of Phase 1's
# /etc/atlas/docker.env plus the keys listed under "Interpolation" below. Every ${VAR} has a default so that a bare
# `docker compose -f <this file> up -d chromadb` (phase2/04-memory.sh's contract) also works from a load_env shell.
#
# Network design (adjudicated conflict 4; Section 3.6, 12.5; CONVENTIONS.md §8):
#   * open-webui runs with network_mode: host. The two host services it must call, the orchestrator ($ORCH_PORT) and
#     the bge-m3 llama-server ($LLAMA_PORT_BASE+9), listen on 127.0.0.1 only (llama-server@.service, atlas-orchestrator
#     .service), which a bridged container cannot reach. On the host network Open WebUI listens on 0.0.0.0:$OPENWEBUI_PORT
#     and ufw (Phase 1 step 4: "allow in on <LAN iface> ... port $OPENWEBUI_PORT" and the same on br-atlas-wg) is what
#     makes it "bound to LAN, WireGuard and loopback" — exactly the pattern used for SSH, Cockpit and xrdp. Its outbound
#     traffic is host traffic: ufw's default-deny OUTPUT with the squid-owner match blocks any direct 80/443, the proxy
#     variables are blanked below, AND phase2/03-openwebui.sh installs a permanent cgroup fence
#     (/usr/local/sbin/atlas-openwebui-egress, unit atlas-openwebui-egress.service): every NEW connection whose socket
#     belongs to this container's cgroup is dropped unless it goes over lo, and on lo the squid proxy (3128), Redis
#     (6379) and ChromaDB (8000) are dropped too. verify/v12-openwebui-offline.sh proves the start-up window; the fence
#     enforces the same rule at run time for the lazy paths (RAG loaders, a malicious document naming a proxy).
#   * redis and chromadb publish on 127.0.0.1 only (loopback is the subset of "loopback, LAN and WireGuard" that
#     Section 12.1 needs: Open WebUI is the face). The ChromaDB 1.x Rust server has no authentication (services
#     research 2.1), so it is never published on the LAN. Redis REQUIRES a password (fix round): every local process
#     could otherwise enqueue Celery tasks with chosen arguments; the password lives in /etc/atlas/secrets/redis.env
#     (phase2/02-orchestrator.sh writes it, the atlas-* units load it with EnvironmentFile=, never in orchestrator.env
#     which restic backs up). Containers on the project bridge get no proxy environment: the proxy that
#     /root/.docker/config.json injects (Phase 1 step 6) is blanked for every service here, and Phase 1's DOCKER-USER
#     rules drop everything else that leaves a bridge.
#   * Open WebUI reaches the overlay's services through their loopback publishes (voice-stt research S8.1 /
#     compose.voice.yml: Kokoro 127.0.0.1:8880, speaches 127.0.0.1:8881, docling 127.0.0.1:5001), not by container
#     name, because it is on the host network.
#
# Interpolation (defaults in brackets): ATLAS_SRV [/srv/atlas], ATLAS_ETC [/etc/atlas], TZ [UTC], OPENWEBUI_PORT [3000],
#   ORCH_PORT [8800], EMBED_PORT [8109], OPENWEBUI_DATA_DIR, REDIS_DATA_DIR, CHROMA_DATA_DIR. Nothing here needs a
#   proxy: redis and chromadb never leave the node, open-webui must not (V12). `$$VAR` is a container-shell variable
#   (compose leaves it alone), used where a secret must not pass through the interpolation file.
#
# Image pins (services research §0, §1.1, §2.1, §3; all VERIFIED tags):
#   redis:8.10.2  chromadb/chroma:1.5.9  ghcr.io/open-webui/open-webui:v0.11.4

name: atlas-core

# Blank the proxy Phase 1 step 6 injects through /root/.docker/config.json: none of these services may leave the node.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

services:
  # --- Redis: Celery broker and result backend (Section 9.7). Loopback only (CONVENTIONS.md §8), password required. ---
  # /etc/atlas/secrets/redis.env (REDIS_PASSWORD=..., written by phase2/02-orchestrator.sh) is the container's env_file;
  # the command re-enters the image's own entrypoint so redis still drops to the `redis` user (gosu). The password NEVER
  # goes on a command line (fix round 2, major: /proc/<pid>/cmdline is world-readable on the host, so `--requirepass X`
  # would show it to every local account for the life of the server): `requirepass` is handed to redis-server as a
  # config document on STDIN (`redis-server [options] -`: a trailing `-` reads the config from stdin, VERIFIED in redis
  # 8.0.0 src/server.c `config_from_stdin`; stdin is parsed after the file and before the explicit options) through a
  # shell here-document, which dash hands over on fd 0 across exec (VERIFIED with a stub: argv carries only `-`, stdin
  # carries the line); the official image's docker-entrypoint.sh consumes no stdin (VERIFIED docker-library/redis: it
  # only re-execs itself through gosu, then `exec "$@"`). UNVERIFIED for 8.10.2 specifically; step 02 proves the result
  # on the node: authenticated PING via REDISCLI_AUTH, NOAUTH from the host, and the password ABSENT from the server's
  # /proc/<pid>/cmdline, and dies otherwise.
  # UNVERIFIED: the entrypoint's name inside redis:8.10.2 (`docker-entrypoint.sh` on PATH is the official image's
  # convention). An EMPTY password would silently disable auth, so the shell refuses to start without one.
  redis:
    image: redis:8.10.2
    container_name: atlas-redis
    restart: unless-stopped
    env_file:
      - path: ${ATLAS_ETC:-/etc/atlas}/secrets/redis.env
        required: false      # the file is validated by the command below; `required: false` keeps `up -d chromadb` (step 4) loadable
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || { echo "atlas-redis: REDIS_PASSWORD is empty (/etc/atlas/secrets/redis.env, phase2/02-orchestrator.sh)" >&2; exit 78; }
        exec docker-entrypoint.sh redis-server --save 60 1 --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction - <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    environment:
      <<: *no-proxy
    volumes:
      - ${REDIS_DATA_DIR:-${ATLAS_SRV:-/srv/atlas}/data/redis}:/data
    networks: [atlas]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # REDISCLI_AUTH is redis-cli's documented environment alternative to -a: the password is on no argv (fix round 2).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- ChromaDB 1.5.9 (Section 10.1): persist_path "/data" is baked into the image's /config.yaml. ---------------------
  # No auth exists in the Rust server config, so the port is loopback only; the orchestrator reaches it at
  # http://127.0.0.1:8000. phase2/04-memory.sh brings it up and creates the six Section 10.1 collections. Open WebUI does
  # NOT share this server (fix round): it keeps its own embedded vector store under its data dir, so its file-<id>
  # collections never sit beside the Vector Cortex and step 3 does not depend on step 4's container.
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: atlas-chromadb
    restart: unless-stopped
    environment:
      <<: *no-proxy
      ANONYMIZED_TELEMETRY: "false"      # UNVERIFIED for the Rust server (it is the Python client's switch); harmless
      CHROMA_TELEMETRY_ENABLED: "false"  # UNVERIFIED variable name; harmless if unknown. The blanked proxy is the belt:
                                         # phase2/04-memory.sh treats any TCP_DENIED from this container as a failure.
    volumes:
      - ${CHROMA_DATA_DIR:-${ATLAS_SRV:-/srv/atlas}/data/chroma}:/data
    networks: [atlas]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Open WebUI 0.11.4 (Section 12.1, Appendix B "Open WebUI offline", V12, D9) ------------------------------------
  # Every ConfigVar is pinned by the environment because ENABLE_PERSISTENT_CONFIG=false makes env always win (services
  # research 1.2); Admin-UI edits are therefore NOT saved, which is what makes re-runs deterministic.
  # Secrets (WEBUI_SECRET_KEY, OPENAI_API_KEY) come from /etc/atlas/secrets/openwebui.env (phase2/03-openwebui.sh).
  # Container hardening (fix round): the image runs as UID 0 on the host network, so capabilities are dropped to the
  # five its start-up needs to own and read its data dir (UNVERIFIED minimal set: CHOWN, SETUID, SETGID, DAC_OVERRIDE,
  # FOWNER — step 03's 300 s /health wait fails loudly if the image needs more), no-new-privileges, a pid and a memory
  # ceiling. The network fence is the atlas-openwebui-egress unit (header).
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: atlas-openwebui
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 1024
    mem_limit: 8g
    env_file:
      - path: ${ATLAS_ETC:-/etc/atlas}/secrets/openwebui.env
        required: false
    volumes:
      - ${OPENWEBUI_DATA_DIR:-${ATLAS_SRV:-/srv/atlas}/data/open-webui}:/app/backend/data
    environment:
      <<: *no-proxy
      # listener (host network): 0.0.0.0 so LAN and WireGuard reach it; ufw scopes it (header)
      HOST: "0.0.0.0"
      PORT: "${OPENWEBUI_PORT:-3000}"
      TZ: "${TZ:-UTC}"
      WEBUI_NAME: "A.T.L.A.S."
      # --- config ownership: env always wins, Admin-UI edits are not persisted (research 1.2, VERIFIED) --------------
      ENABLE_PERSISTENT_CONFIG: "false"
      # --- offline hardening (Section 12.1, Appendix B; research 1.2/1.5, every variable VERIFIED unless noted) -------
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_WEB_SEARCH: "false"                 # ENABLE_RAG_WEB_SEARCH no longer exists (research conflict 3)
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
      WHISPER_MODEL_AUTO_UPDATE: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_GOOGLE_DRIVE_INTEGRATION: "false"
      ENABLE_ONEDRIVE_INTEGRATION: "false"
      ENABLE_CODE_EXECUTION: "false"             # pyodide/micropip CDN use is UNVERIFIED; the orchestrator has its own sandbox (16.4)
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"    # UNVERIFIED variable name (research S1 snippet); harmless if unknown
      # library-level telemetry switches (UNVERIFIED that any fires in 0.11.4; belt and braces for V12)
      ANONYMIZED_TELEMETRY: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      SCARF_NO_ANALYTICS: "true"
      # --- auth: one Principal; the first user is created by 03-openwebui.sh through POST /api/v1/auths/signup, which
      #     bypasses ENABLE_SIGNUP=false while the user table is empty (research 1.4, VERIFIED) --------------------------
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
      DEFAULT_USER_ROLE: "pending"
      ENABLE_API_KEYS: "true"                    # ENABLE_API_KEY is deprecated (research conflict 3)
      ENABLE_ADMIN_EXPORT: "true"                # the D9 retention task reads /api/v1/chats/all/db
      ENABLE_ADMIN_CHAT_ACCESS: "true"
      # --- models: the orchestrator is the only backend; its /v1/models lists atlas, ren, arthur (Section 12.1) -------
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "http://127.0.0.1:${ORCH_PORT:-8800}/v1"
      DEFAULT_MODELS: "atlas"
      # --- retrieval: bge-m3 on llama-server (engine index 9, step 4, used on demand); vectors in Open WebUI's OWN
      #     embedded store under /app/backend/data/vector_db (inside the data dir, in the restic include set). The
      #     shared ChromaDB is the orchestrator's Vector Cortex (10.1) and comes up in step 4, after this container
      #     (fix round: Section 17 order). The token splitter would fetch a tiktoken encoding on first use, so the
      #     character splitter is pinned and the cache dir is local (research: lazy fetch UNVERIFIED for 0.11.4).
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_OPENAI_API_BASE_URL: "http://127.0.0.1:${EMBED_PORT:-8109}/v1"
      RAG_OPENAI_API_KEY: "atlas-local"
      RAG_EMBEDDING_MODEL: "embed-bge-m3"
      RAG_EMBEDDING_BATCH_SIZE: "16"
      RAG_TEXT_SPLITTER: "character"
      TIKTOKEN_CACHE_DIR: "/app/backend/data/cache/tiktoken"
      CONTENT_EXTRACTION_ENGINE: "docling"       # UNVERIFIED: docs say "Docling 2.0.0+"; docling-serve is 1.34 (research 2.3)
      DOCLING_SERVER_URL: "http://127.0.0.1:5001"
      # --- speech: speaches (Whisper large-v3-turbo, CPU int8) and Kokoro, both OpenAI-shaped (voice research 4.4, 2) --
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://127.0.0.1:8881/v1"
      AUDIO_STT_OPENAI_API_KEY: "atlas-local"
      AUDIO_STT_MODEL: "whisper-1"               # alias in speaches' model_aliases.json -> the turbo model (voice research 4.1)
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://127.0.0.1:8880/v1"
      AUDIO_TTS_OPENAI_API_KEY: "atlas-local"
      AUDIO_TTS_MODEL: "kokoro"                  # VERIFIED model id (Kokoro-FastAPI openai_mappings.json)
      AUDIO_TTS_VOICE: "af_heart"                # VERIFIED preset; per-persona voices are set per model after V7 (14.3)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${OPENWEBUI_PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # The project bridge every bridged core service joins; docker/core/compose.voice.yml (kokoro, speaches, docling)
  # merges into this project and joins the same network by this name (its header states that contract).
  atlas: {}
