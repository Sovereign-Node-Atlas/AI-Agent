# docker/ntfy/compose.yml — self-hosted ntfy (Sections 9.3, 12.2; Phase 1 step 7). Image pinned per the platform
# research (item 9). Interpolated from /etc/atlas/docker.env (LAN_IP, ATLAS_UID, ATLAS_GID, TZ, NTFY_DATA_DIR).
#
# CONTRACT NOTE for the Phase 2 writer: CONVENTIONS.md §1 lists ntfy inside docker/core/compose.yml, but Section 17
# Phase 1 step 7 brings ntfy up in Phase 1, so it lives here as compose project "atlas-ntfy", container "atlas-ntfy",
# host ports 127.0.0.1:8090 and ${LAN_IP}:8090 (CONVENTIONS.md §8). docker/core/compose.yml must NOT declare a second
# ntfy on 8090; use this one. Auth is default-deny; the node token is /etc/atlas/secrets/ntfy.env (NTFY_TOKEN=...).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: atlas-ntfy
    command: ["serve"]
    environment:
      - TZ=${TZ}
    user: "${ATLAS_UID}:${ATLAS_GID}"
    volumes:
      - ${NTFY_DATA_DIR}/etc:/etc/ntfy
      - ${NTFY_DATA_DIR}/cache:/var/cache/ntfy
      - ${NTFY_DATA_DIR}/lib:/var/lib/ntfy
    ports:
      - "${LAN_IP}:8090:80"
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true
